// ---- Isometric truck + stack renderer ----
// camYaw = 0 reproduces the exact original fixed-angle look; dragging the canvas spins the
// model around its vertical axis by adjusting this. camZoom scales the auto-fit view; the
// scroll wheel adjusts it. Both persist across re-renders (recompute, truck switch, theme
// change) until the user resets them, same as the route map's pan/zoom state.
let camYaw = 0;
let camZoom = 1;

function rotateXZ(x, z) {
  const cosR = Math.cos(camYaw), sinR = Math.sin(camYaw);
  return [x * cosR - z * sinR, x * sinR + z * cosR];
}
function project(x, y, z) {
  // x: along length (0..L), y: height (0..H), z: along width (0..W)
  const [rx, rz] = rotateXZ(x, z);
  const cos30 = Math.cos(Math.PI / 6), sin30 = Math.sin(Math.PI / 6);
  const sx = (rx - rz) * cos30;
  const sy = (rx + rz) * sin30 - y;
  return [sx, sy];
}

function renderCanvas(t) {
  const canvas = document.getElementById('sim');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || canvas.parentElement.clientWidth;
  const cssH = 460;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const dark = isDark();
  const lineColor = dark ? '#333a40' : '#dad5c8';
  const ink = dark ? '#e7e4dc' : '#23262a';

  const { L, W, H } = DATA.truckDims;

  // compute projected bounding box of the truck to fit canvas
  const corners = [
    [0,0,0],[L,0,0],[0,0,W],[L,0,W],
    [0,H,0],[L,H,0],[0,H,W],[L,H,W]
  ].map(([x,y,z]) => project(x,y,z));
  const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const margin = 36;
  const fitScale = Math.min((cssW - margin*2) / (maxX - minX), (cssH - margin*2) / (maxY - minY));
  const scale = fitScale * camZoom;
  const offX = margin - minX*scale + ((cssW - margin*2) - (maxX-minX)*scale)/2;
  const offY = margin - minY*scale + ((cssH - margin*2) - (maxY-minY)*scale)/2;

  function P(x,y,z) {
    const [sx, sy] = project(x,y,z);
    return [sx*scale + offX, sy*scale + offY];
  }

  function poly(pts, fill, stroke, alpha) {
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    if (fill) { ctx.globalAlpha = alpha ?? 1; ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = 1; }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }

  // draw truck floor (wireframe) first
  poly([P(0,0,0), P(L,0,0), P(L,0,W), P(0,0,W)], null, lineColor);

  // sort items back-to-front for painter's algorithm, by rotated depth ascending -- has to
  // track camYaw (via rotateXZ) or the draw order goes wrong the moment the view is spun,
  // since "further from camera" no longer means "larger x+z" once the model is rotated.
  const items = [...t.items].sort((a, b) => {
    const [, da] = rotateXZ(a.x + a.dx/2, a.y + a.dy/2);
    const [, db] = rotateXZ(b.x + b.dx/2, b.y + b.dy/2);
    return da - db;
  });

  const palletColor = dark ? '#8a6238' : '#a0784a';
  items.forEach(it => {
    const color = paletteColor(it.c, DATA.customers.length, dark);
    const x0 = it.x, x1 = it.x + it.dx;
    const z0 = it.y, z1 = it.y + it.dy; // note: item.y is truck-width axis (z)
    // y0 = this item's own floor: 0 normally, or another item's height if it's stacked on
    // top of it (手工疊車 space-saving) -- the pallet block (if any) and cargo both sit
    // above y0, not above absolute 0, so a topped item doesn't draw a phantom wood block
    // reaching all the way down through the item it's resting on.
    const y0 = it.y0 || 0;
    const yBase = y0 + Math.min(it.baseH ?? 0, it.h);
    const y1 = y0 + it.h;

    if (yBase > y0) {
      // pallet base block (wood tone)
      poly([P(x0,yBase,z0), P(x1,yBase,z0), P(x1,yBase,z1), P(x0,yBase,z1)], palletColor, dark ? '#000' : '#0002', 1);
      poly([P(x0,y0,z0), P(x1,y0,z0), P(x1,yBase,z0), P(x0,yBase,z0)], shade(palletColor, 0.78), dark ? '#000' : '#0002');
      poly([P(x1,y0,z0), P(x1,y0,z1), P(x1,yBase,z1), P(x1,yBase,z0)], shade(palletColor, 0.6), dark ? '#000' : '#0002');
    }
    // goods on top of the pallet, in customer colour
    poly([P(x0,y1,z0), P(x1,y1,z0), P(x1,y1,z1), P(x0,y1,z1)], color, dark ? '#000' : '#0002', 1);
    poly([P(x0,yBase,z0), P(x1,yBase,z0), P(x1,y1,z0), P(x0,y1,z0)], shade(color, 0.78), dark ? '#000' : '#0002');
    poly([P(x1,yBase,z0), P(x1,yBase,z1), P(x1,y1,z1), P(x1,y1,z0)], shade(color, 0.6), dark ? '#000' : '#0002');

    // 疊車順序 label on the top face -- same number as this stack's dispatch-sheet row,
    // so the two views can be checked against each other directly instead of by eye alone.
    const [lx, ly] = P((x0 + x1) / 2, y1, (z0 + z1) / 2);
    ctx.font = 'bold 9px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(it.seq, lx, ly + 3);
    ctx.fillStyle = '#fff';
    ctx.fillText(it.seq, lx, ly + 3);
  });

  // truck wireframe edges (front pillars + top outline) drawn last for clarity
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1.25;
  [
    [[0,0,0],[0,H,0]], [[L,0,0],[L,H,0]], [[0,0,W],[0,H,W]], [[L,0,W],[L,H,W]],
    [[0,H,0],[L,H,0]], [[0,H,0],[0,H,W]], [[L,H,0],[L,H,W]], [[0,H,W],[L,H,W]],
    [[0,0,0],[L,0,0]], [[0,0,W],[L,0,W]], [[0,0,0],[0,0,W]], [[L,0,0],[L,0,W]],
  ].forEach(([a,b]) => {
    const pa = P(...a), pb = P(...b);
    ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke();
  });

  // 車頭 (front/cab end, x=0 -- where the last-delivered customer's load sits, packed
  // deepest) and 車尾 (rear/door end, x=L -- where the first-delivered customer's load
  // sits, nearest the door) -- see the repack step in computePlan.
  const axisDir = project(1, 0, 0);
  const axisLen = Math.hypot(axisDir[0], axisDir[1]) || 1;
  const nx = axisDir[0] / axisLen, ny = axisDir[1] / axisLen;
  const NUDGE = 24;
  ctx.fillStyle = ink;
  ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'center';
  const headP = P(0, 0, W / 2);
  ctx.fillText('車頭', headP[0] - nx * NUDGE, headP[1] - ny * NUDGE + 4);
  const tailP = P(L, 0, W / 2);
  ctx.fillText('車尾', tailP[0] + nx * NUDGE, tailP[1] + ny * NUDGE + 4);

  canvas._items = items;
  canvas._P = P;
}

function shade(hsl, factor) {
  const m = hsl.match(/hsl\(([\d.]+) ([\d.]+)% ([\d.]+)%\)/);
  if (!m) return hsl;
  const [, h, s, l] = m;
  return `hsl(${h} ${s}% ${(parseFloat(l) * factor).toFixed(1)}%)`;
}

// hover tooltip + drag-to-rotate + wheel-to-zoom
const tooltip = document.getElementById('tooltip');
const simCanvas = document.getElementById('sim');
simCanvas.style.cursor = 'grab';
let simDragging = false, simDragStartX = 0, simDragStartYaw = 0, simDragMoved = false;

simCanvas.addEventListener('mousedown', (e) => {
  simDragging = true; simDragMoved = false;
  simDragStartX = e.clientX; simDragStartYaw = camYaw;
  simCanvas.style.cursor = 'grabbing';
  tooltip.classList.remove('show');
});
window.addEventListener('mousemove', (e) => {
  if (!simDragging) return;
  const dx = e.clientX - simDragStartX;
  if (Math.abs(dx) > 2) simDragMoved = true; // small moves still count as a click, not a drag
  camYaw = simDragStartYaw + dx * 0.008;
  const ct1 = currentTruck();
  if (ct1) renderCanvas(ct1);
});
window.addEventListener('mouseup', () => {
  if (!simDragging) return;
  simDragging = false;
  simCanvas.style.cursor = 'grab';
});
simCanvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  camZoom = Math.min(4, Math.max(0.4, camZoom * factor));
  const ct2 = currentTruck();
  if (ct2) renderCanvas(ct2);
}, { passive: false });

simCanvas.addEventListener('mousemove', (e) => {
  if (simDragging) return; // rotating -- tooltip would just flicker under the cursor
  const canvas = e.target;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const items = canvas._items || [];
  let hit = null;
  // hit-test top faces roughly via bounding polygon of projected top face
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const x0 = it.x, x1 = it.x + it.dx, z0 = it.y, z1 = it.y + it.dy, y0 = it.y0 || 0, y1 = y0 + it.h;
    const pts = [canvas._P(x0,y1,z0), canvas._P(x1,y1,z0), canvas._P(x1,y1,z1), canvas._P(x0,y1,z1),
                 canvas._P(x0,y0,z0)];
    const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
    if (mx >= Math.min(...xs) && mx <= Math.max(...xs) && my >= Math.min(...ys) && my <= Math.max(...ys)) {
      hit = it; break;
    }
  }
  if (hit) {
    tooltip.innerHTML = `疊車順序 #${hit.seq}<br>訂單 ${hit.o}<br>品號 ${hit.it}<br>楞別 ${hit.fl || '—'}<br>本堆 ${hit.b} 箱`;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.classList.add('show');
  } else {
    tooltip.classList.remove('show');
  }
});
simCanvas.addEventListener('mouseleave', () => { if (!simDragging) tooltip.classList.remove('show'); });
simCanvas.addEventListener('dblclick', () => {
  camYaw = 0; camZoom = 1;
  const ct3 = currentTruck();
  if (ct3) renderCanvas(ct3);
});

// Ignores empty/zero/negative input rather than recomputing against a broken truck size --
// the field just keeps its last valid value until the user fixes it.
function updateTruckDims() {
  const l = Number(document.getElementById('truckLInput').value);
  const w = Number(document.getElementById('truckWInput').value);
  const h = Number(document.getElementById('truckHInput').value);
  if (!(l > 0 && w > 0 && h > 0)) return;
  TRUCK_L = l; TRUCK_W = w; TRUCK_H = h;

}

function setViewMode(mode) {
  VIEW_MODE = mode;
  document.querySelectorAll('#viewModeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  // 車次最大客戶數 / 方向限制豁免距離 only affect the automatic multi-customer clustering
  // (packStacksIntoTrucks) -- 模擬裝車 never runs that pass (it packs exactly the customers

  // do anything here.

  document.getElementById('dirExemptKmLabel').classList.toggle('disabled', sim);

}

// ---- map pan/zoom interaction ----
(() => {
  const mapCanvas = document.getElementById('mapCanvas');
  mapCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = mapCanvas.getBoundingClientRect();
    zoomMapBy(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  let dragging = false, dragStartX = 0, dragStartY = 0, camStartCx = 0, camStartCy = 0;
  mapCanvas.addEventListener('pointerdown', (e) => {
    if (!mapRenderState) return;
    dragging = true;
    mapCanvas.setPointerCapture(e.pointerId);
    dragStartX = e.clientX; dragStartY = e.clientY;
    camStartCx = mapCamera.cx; camStartCy = mapCamera.cy;
  });
  mapCanvas.addEventListener('pointermove', (e) => {
    if (!dragging || !mapRenderState) return;
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    mapCamera.cx = camStartCx - dx / mapRenderState.scale;
    mapCamera.cy = camStartCy - dy / mapRenderState.scale;
    const ct4 = currentTruck();
    if (ct4) renderMap(ct4);
  });
  const endDrag = () => { dragging = false; };
  mapCanvas.addEventListener('pointerup', endDrag);
  mapCanvas.addEventListener('pointercancel', endDrag);

  document.getElementById('mapZoomIn').addEventListener('click', () => zoomMapBy(1.4));
  document.getElementById('mapZoomOut').addEventListener('click', () => zoomMapBy(1 / 1.4));
  document.getElementById('mapZoomReset').addEventListener('click', resetMapView);
})();

recompute();
