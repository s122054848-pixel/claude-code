<meta charset="utf-8">
<title>排車單與3D裝載模擬</title>
<style>
  :root {
    --bg: #f1eee7;
    --surface: #ffffff;
    --surface-2: #e9e4d8;
    --ink: #23262a;
    --muted: #6e7168;
    --line: #dad5c8;
    --accent: #2e5f73;
    --accent-soft: #dde8ea;
    --accent-2: #b98a55;
    --good: #3f8f5f;
    --warn: #c98a2b;
    --critical: #c1443b;
    --radius: 6px;
    --font-display: "Archivo Narrow", "Roboto Condensed", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Noto Sans TC", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c;
      --surface: #1c2126;
      --surface-2: #20262c;
      --ink: #e7e4dc;
      --muted: #9ba098;
      --line: #333a40;
      --accent: #6fb0c8;
      --accent-soft: #22333a;
      --accent-2: #c89a66;
      --good: #5cbb80;
      --warn: #e0a94d;
      --critical: #e0685d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181c; --surface: #1c2126; --surface-2: #20262c; --ink: #e7e4dc;
    --muted: #9ba098; --line: #333a40; --accent: #6fb0c8; --accent-soft: #22333a;
    --accent-2: #c89a66; --good: #5cbb80; --warn: #e0a94d; --critical: #e0685d;
  }
  :root[data-theme="light"] {
    --bg: #f1eee7; --surface: #ffffff; --surface-2: #e9e4d8; --ink: #23262a;
    --muted: #6e7168; --line: #dad5c8; --accent: #2e5f73; --accent-soft: #dde8ea;
    --accent-2: #b98a55; --good: #3f8f5f; --warn: #c98a2b; --critical: #c1443b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
  }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header.topbar {
    padding: 18px 24px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
  }
  .title-block h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.01em;
    margin: 0 0 2px;
    text-wrap: balance;
  }
  .title-block .sub {
    color: var(--muted);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  .date-range {
    margin-top: 9px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .date-range label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
  }
  .date-range input[type="date"], .date-range input[type="number"], .date-range select {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 12.5px; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px;
  }
  .date-range input[type="number"] { width: 62px; }
  .date-range select { font-weight: 600; color: var(--accent); }
  .date-range span { color: var(--muted); font-size: 12px; }
  .date-range button {
    font-family: var(--font-body); font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border: 1px solid var(--line); border-radius: 100px;
    padding: 4px 12px; cursor: pointer;
  }
  .date-range button:hover { filter: brightness(0.96); }
  .range-note { color: var(--warn) !important; }
  .mode-toggle {
    display: inline-flex; border: 1px solid var(--line); border-radius: 100px; overflow: hidden;
  }
  .mode-toggle button {
    font-family: var(--font-body); font-size: 12px; color: var(--muted);
    background: var(--surface-2); border: none; border-radius: 0;
    padding: 5px 13px; cursor: pointer;
  }
  .mode-toggle button.active { background: var(--accent); color: var(--surface); font-weight: 600; }
  .mode-toggle button:not(.active):hover { filter: brightness(0.95); }
  .slider-label.disabled { opacity: 0.4; pointer-events: none; }
  .slider-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); letter-spacing: 0.02em;
  }
  .slider-label input[type="range"] {
    width: 140px; accent-color: var(--accent-2);
  }
  .slider-val {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--accent-2); min-width: 42px;
  }
  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat {
    display: flex; flex-direction: column; gap: 2px; min-width: 74px;
  }
  .stat .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
  }
  .stat .lbl {
    font-size: 11px; color: var(--muted); letter-spacing: 0.04em;
  }

  .body-grid {
    display: grid;
    grid-template-columns: 240px 1fr;
    flex: 1;
    min-height: 0;
  }

  aside.truck-list {
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    max-height: calc(100vh - 88px);
  }
  aside.truck-list .list-head {
    padding: 12px 16px 8px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .truck-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 16px;
    border: none;
    border-left: 3px solid transparent;
    background: none;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--ink);
    font-size: 13px;
  }
  .truck-item:hover { background: var(--accent-soft); }
  .truck-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .truck-item .row1 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .truck-item .row1 .no { font-weight: 600; }
  .truck-item .row1 .stacks { color: var(--muted); font-size: 11.5px; }
  .util-bar {
    margin-top: 5px;
    height: 5px;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .util-bar > i {
    display: block; height: 100%; background: var(--accent);
    border-radius: 3px;
  }
  .util-bar.low > i { background: var(--warn); }

  main.viewport {
    padding: 20px 26px 30px;
    overflow-y: auto;
    max-height: calc(100vh - 88px);
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
  }
  .panel-head h2 {
    font-family: var(--font-display);
    font-size: 17px; margin: 0; font-weight: 700;
  }
  .util-pill {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 12px; padding: 3px 10px; border-radius: 100px;
    background: var(--surface-2); color: var(--muted);
  }
  .util-pill.good { color: var(--good); }
  .util-pill.warn { color: var(--warn); }

  .canvas-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px;
  }
  canvas#sim, canvas#mapCanvas {
    display: block; width: 100%; height: 400px; border-radius: 4px;
  }
  canvas#mapCanvas { cursor: grab; touch-action: none; }
  canvas#mapCanvas:active { cursor: grabbing; }
  .map-zoom-controls { display: inline-flex; gap: 4px; }
  .map-zoom-controls button {
    width: 22px; height: 22px; line-height: 1; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .map-zoom-controls button:hover { filter: brightness(0.95); }

  .dual-panel {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    align-items: start;
  }
  .panel-label {
    font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px; font-weight: 600;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: 10px 16px;
    padding: 10px 4px 2px; font-size: 11.5px; color: var(--muted);
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 5px; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  .map-stats {
    display: flex; gap: 20px; padding: 10px 4px 2px; flex-wrap: wrap;
  }
  .map-stats .stat2 { display: flex; flex-direction: column; gap: 1px; }
  .map-stats .stat2 .num {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 17px; font-weight: 600; color: var(--accent-2);
  }
  .map-stats .stat2 .lbl { font-size: 11px; color: var(--muted); }
  .map-stops {
    font-size: 11.5px; color: var(--muted); padding: 2px 4px 0;
    display: flex; flex-wrap: wrap; gap: 6px 4px;
  }
  .map-stops .stop-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface-2); border-radius: 100px; padding: 2px 9px 2px 6px;
  }
  .map-stops .stop-chip .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; background: var(--accent-2);
    color: var(--surface); font-size: 9.5px; font-weight: 700; flex: none;
  }

  @media (max-width: 900px) {
    .dual-panel { grid-template-columns: 1fr; }
  }

  table.dispatch {
    width: 100%; border-collapse: collapse; margin-top: 18px;
    font-size: 12.5px;
  }
  table.dispatch caption {
    text-align: left; font-family: var(--font-display); font-weight: 700;
    font-size: 15px; margin-bottom: 8px; caption-side: top;
  }
  table.dispatch th {
    text-align: left; font-size: 11px; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600; text-transform: uppercase;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--surface);
  }
  table.dispatch td {
    padding: 7px 10px; border-bottom: 1px solid var(--line);
  }
  table.dispatch tbody tr:hover { background: var(--surface-2); }
  table.dispatch td.num, table.dispatch th.num {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right;
  }
  table.dispatch tfoot td {
    border-top: 1.5px solid var(--ink); border-bottom: none;
    font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--accent-2);
  }
  .table-scroll { overflow-x: auto; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 20;
    background: var(--ink); color: var(--bg);
    font-family: var(--font-mono); font-size: 11.5px;
    padding: 6px 9px; border-radius: 4px; line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .08s ease;
    max-width: 240px;
  }
  .tooltip.show { opacity: 1; }

  .empty-note { color: var(--muted); font-size: 12.5px; padding: 20px 0; }

  .sim-overflow {
    margin-bottom: 14px;
    padding: 10px 14px;
    border: 1px solid var(--critical);
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--critical) 10%, var(--surface));
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .sim-overflow strong { color: var(--critical); }
  .sim-overflow ul { margin: 6px 0 0; padding-left: 18px; }

  .sim-summary { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .sim-search { padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .sim-search input {
    width: 100%; box-sizing: border-box; font-family: var(--font-body); font-size: 12.5px;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px;
  }
  .sim-search input:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; }
  .sim-actions { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .sim-actions button {
    font-family: var(--font-body); font-size: 12.5px; border-radius: 100px; cursor: pointer;
    padding: 6px 0; border: 1px solid var(--line);
  }
  .sim-actions button.primary { flex: 1; background: var(--accent); color: var(--surface); border: none; font-weight: 600; }
  .sim-actions button.secondary { padding: 6px 14px; background: var(--surface-2); color: var(--muted); }
  .sim-cust {
    display: flex; align-items: center; gap: 6px; padding: 8px 16px;
    cursor: pointer; font-size: 12.5px; font-weight: 600; border-top: 1px solid var(--line);
  }
  .sim-cust span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sim-order {
    display: flex; align-items: center; gap: 6px; padding: 3px 16px 3px 34px;
    cursor: pointer; font-size: 11.5px; color: var(--muted);
  }
  .sim-order span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

  @media (max-width: 780px) {
    .body-grid { grid-template-columns: 1fr; }
    aside.truck-list { max-height: 220px; border-right: none; border-bottom: 1px solid var(--line); }
    main.viewport { max-height: none; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="title-block">
      <h1>排車單 &amp; 3D裝載模擬</h1>
      <div class="sub"><span id="metaPlant">—</span>出貨排車 · 資料日期 <span id="metaDate">—</span></div>
      <div class="date-range">
        <label>廠區
          <select id="plantSelect"></select>
        </label>
        <label>車廂內徑(mm)
          <input type="number" id="truckLInput" min="1000" step="100" value="8700" title="長 L">
          ×
          <input type="number" id="truckWInput" min="500" step="100" value="2400" title="寬 W">
          ×
          <input type="number" id="truckHInput" min="500" step="100" value="2400" title="高 H">
        </label>
        <label>訂單日期
          <input type="date" id="rangeStart">
          <span>至</span>
          <input type="date" id="rangeEnd">
        </label>
        <label>訂單交期
          <input type="date" id="deliveryFilter">
          <button type="button" id="deliveryClear" title="清除交期篩選,顯示區間內所有交期">清除</button>
        </label>
        <button type="button" id="rangeReset">重設為預設(訂單日期:一個月前–一星期後 · 交期:明天)</button>
        <span class="range-note" id="rangeNote"></span>
      </div>
      <div class="date-range">
        <div class="mode-toggle" id="viewModeToggle" role="radiogroup" aria-label="檢視模式">
          <button type="button" data-mode="auto" class="active">自動排車</button>
          <button type="button" data-mode="sim">模擬裝車</button>
        </div>
        <div class="mode-toggle" id="loadModeToggle" role="radiogroup" aria-label="裝車方式">
          <button type="button" data-mode="pallet" class="active">棧板疊車</button>
          <button type="button" data-mode="manual">手工疊車</button>
        </div>
        <label class="slider-label" id="overhangWLabel">棧板容許延伸寬度
          <input type="range" id="overhangW" min="0" max="100" step="10" value="50">
          <span class="slider-val" id="overhangWVal">50mm</span>
        </label>
        <label class="slider-label" id="overhangLLabel">棧板容許延伸長度
          <input type="range" id="overhangL" min="0" max="500" step="10" value="300">
          <span class="slider-val" id="overhangLVal">300mm</span>
        </label>
        <label class="slider-label" id="maxCustPerTruckLabel">車次最大客戶數
          <input type="range" id="maxCustPerTruck" min="1" max="8" step="1" value="3">
          <span class="slider-val" id="maxCustPerTruckVal">3</span>
        </label>
        <label class="slider-label" id="dirExemptKmLabel">方向限制豁免距離(離廠區內不限方向)
          <input type="range" id="dirExemptKm" min="0" max="50" step="1" value="15">
          <span class="slider-val" id="dirExemptKmVal">15km</span>
        </label>
        <button type="button" id="exportExcelBtn">匯出Excel(全部車次)</button>
        <button type="button" id="downloadToolBtn" title="將本工具目前畫面存成一個獨立HTML檔,離線也能開啟使用">下載工具(HTML)</button>
      </div>
    </div>
    <div class="stat-row" id="statRow"></div>
  </header>

  <div class="body-grid">
    <aside class="truck-list" id="truckList">
      <div class="list-head">車次列表(依裝載率)</div>
    </aside>

    <main class="viewport">
      <div class="panel-head">
        <div>
          <h2 id="truckTitle">車次 1</h2>
          <div class="sub" id="truckCust" style="color:var(--muted);font-size:12.5px;margin-top:2px;"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="util-pill" id="caiPill">材數 —</span>
          <span class="util-pill" id="utilPill">裝載率 —</span>
        </div>
      </div>

      <div class="sim-overflow" id="simOverflow" style="display:none;"></div>

      <div class="dual-panel">
        <div>
          <div class="panel-label">3D裝載模擬(可滾輪縮放、拖曳旋轉)</div>
          <div class="canvas-wrap">
            <canvas id="sim"></canvas>
          </div>
          <div class="legend" id="legend"></div>
        </div>
        <div>
          <div class="panel-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span>送貨客戶地理位置(可滾輪縮放、拖曳移動)</span>
            <span class="map-zoom-controls">
              <button type="button" id="mapZoomOut" title="縮小">&minus;</button>
              <button type="button" id="mapZoomReset" title="重置視圖">⤢</button>
              <button type="button" id="mapZoomIn" title="放大">+</button>
            </span>
          </div>
          <div class="canvas-wrap">
            <canvas id="mapCanvas"></canvas>
          </div>
          <div class="map-stats" id="mapStats"></div>
        </div>
      </div>

      <div class="table-scroll">
        <table class="dispatch" id="dispatchTable">
          <caption>排車單明細</caption>
          <thead>
            <tr>
              <th class="num">疊車順序</th>
              <th>送貨客戶</th><th>訂單號</th><th>品號</th><th>楞別</th><th>單位</th>
              <th class="num">箱數</th><th class="num">箱寬mm</th><th class="num">箱長mm</th><th class="num">厚mm</th>
              <th>單位尺寸mm</th><th class="num">堆數</th>
              <th class="num">堆疊高度mm</th><th class="num">單位總高mm</th>
              <th class="num">材數/箱</th><th class="num">材數合計</th>
            </tr>
          </thead>
          <tbody id="dispatchBody"></tbody>
          <tfoot id="dispatchFoot"></tfoot>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const RAW_LINES_BY_PLANT = /*__RAW_LINES__*/{}/*__END_RAW_LINES__*/;
const REPORT_DEFAULTS = /*__REPORT_DEFAULTS__*/{"truckL":8700,"truckW":2400,"truckH":2400,"loadMode":"pallet","plantCode":"T2","dateLabel":"2026-07-01"}/*__END_REPORT_DEFAULTS__*/;
const PLANT_ORDER = ["T2", "T10", "T3", "T6"];
let CURRENT_PLANT = REPORT_DEFAULTS.plantCode;
function currentLines() { return RAW_LINES_BY_PLANT[CURRENT_PLANT]?.lines || []; }
function currentPlantLabel() { return RAW_LINES_BY_PLANT[CURRENT_PLANT]?.label || CURRENT_PLANT; }

// plant depot locations (geocoded from the factory street addresses); every truck departs from here.
const PLANT_INFO = {
  T2:  { name: "龍潭廠", addr: "桃園市龍潭區烏林里工二路280號",     lat: 24.8858522, lng: 121.2081546 },
  T10: { name: "雲林廠", addr: "雲林縣斗六市十三里十三北路25號",   lat: 23.7511800, lng: 120.5697657 },
  T3:  { name: "神岡廠", addr: "臺中市神岡區新庄里溪頭路78號",     lat: 24.2871740, lng: 120.6496444 },
  T6:  { name: "路竹廠", addr: "高雄市路竹區北嶺里中山南路100-1號", lat: 22.8310267, lng: 120.2657714 },
};
function currentPlantPoint() { return PLANT_INFO[CURRENT_PLANT]; }

// precomputed real driving-distance matrix (km) for the current plant, plus the pseudo-code

  runs.forEach((r, i) => { if (!(r.key in firstIdx)) firstIdx[r.key] = i; lastIdx[r.key] = i; });

}

// than N/S/E/W, set by the people who actually plan these routes. Only ~21% of customers have

// find where `stack` would land in `truck` without mutating anything yet. Tries both the
// box's own orientation and it rotated 90 degrees, and where both would technically fit,
// prefers whichever uses LESS width (smaller dy) -- that leaves the most room in the row for
// a second, different item to share it with, which is what actually drives loading rate in a
// shelf packer. (First attempt at this picked whichever wasted less width FOR THIS ITEM
// ALONE, i.e. the LARGER dy -- that's backwards: it greedily eats the width a future item

// after it share that same row's leftover space if there's room. (Tried several alternative
// packers -- guillotine and skyline free-rectangle strategies that give each group its own
// private region -- but they measured WORSE in practice: giving every group an isolated
// rectangle forfeits exactly the "two small adjacent groups share one row's leftover width"

// 手工疊車 only: a skyline tracks the current fill-length along the truck independently for

// does. That fixed-depth-per-row rule is exactly why, with manual mode's wildly varied box

// can't be placed at all. (Used to reorder here to opportunistically stack a later group's

  // workers will see, so that's the one every rider comparison must be checked against. Keying
  // a plain Map by stackGroupKey and letting later stacks silently overwrite earlier ones would

  // could still sit before the base it's meant to be riding on, even though the last one doesn't.

function placeGroupsBestFit(truck, groups) {

  if (LOAD_MODE !== 'manual') return placeGroupStacks(truck, groups.flatMap(g => g.stacks));

  const footprint = g => g.stacks[0].w * g.stacks[0].l;
  const minSide = g => Math.min(g.stacks[0].w, g.stacks[0].l);

    gs => gs, // original packOrder-derived order (delivery-rank, then footprint descending) --

              // a line onto a column opened by an EARLIER-processed (larger-footprint) line.

    gs => [...gs].sort((a, b) => minSide(a) - minSide(b)), // narrowest side first
    gs => [...gs].sort((a, b) => minSide(b) - minSide(a)), // widest side first

// into the truck being filled, that truck is closed off exactly as-is and a fresh truck is
// started for it and everything after -- so a group can NEVER end up split around another
// group's stack. This can use one more physical truck than the theoretical minimum in

// truck can hold ALL of it and leaves the LEAST unused cargo VOLUME afterward (tie-broken by
// proximity) — matches the stated priority: 裝載率優先, 距離其次, now with "same customer, same

// what 裝載率 itself means (see the util calc below) -- a truck can look "full" by floor space

  const VOL_BUCKET = TRUCK_VOL * 0.014; // ~1.4% of truck volume: trucks within the same bucket count as "equally full"

  const byCust = new Map();
  for (const s of stacks) {
    if (!byCust.has(s.custCode)) byCust.set(s.custCode, []);
    byCust.get(s.custCode).push(s);
  }
  const custGroups = [...byCust.values()]
    .map(list => [...list].sort((a, b) => (b.w * b.l) - (a.w * a.l) /* no alphabetical tiebreak: same-footprint stacks must keep the
          relative order packManualColumns created them in, since that order IS the base/rider
          dependency -- an alphabetical-by-key tiebreak would reorder same-footprint ties by
          coincidence of item-code spelling, which can silently swap a rider ahead of the very
          base it was merged onto. Array.prototype.sort is spec-guaranteed stable, so leaving
          ties unresolved here preserves whatever order they already arrived in instead. */))
    .sort((a, b) => b.reduce((s, x) => s + x.w * x.l, 0) - a.reduce((s, x) => s + x.w * x.l, 0));

  for (const custStacks of custGroups) {
    const custCode = custStacks[0].custCode;

    let bestIdx = -1, bestState = null, bestBucket = Infinity, bestProx = Infinity;
    for (let i = 0; i < trucks.length; i++) {
      const truck = trucks[i];
      if (!truck._custSet.has(custCode)) {
        if (truck._custSet.size >= maxCustomers) continue;
        if (!groupingCompatible(truck, custCode, custRouteByCode, custPoints)) continue;
      }
      const trial = cloneTruckState(truck);
      let ok = true;
      for (const s of custStacks) {
        const fit = findFit(trial, s);
        if (!fit) { ok = false; break; }
        applyFit(trial, s, fit);
      }
      if (!ok) continue;
      const remaining = TRUCK_VOL - trial._cargoVol;
      const bucket = Math.floor(remaining / VOL_BUCKET);
      const prox = truckProximity(truck, custStacks[0], custPoints);
      if (bucket < bestBucket || (bucket === bestBucket && prox < bestProx)) {
        bestIdx = i; bestState = trial; bestBucket = bucket; bestProx = prox;
      }
    }
    if (bestIdx >= 0) {
      trucks[bestIdx] = bestState;
      lockTruckGrouping(trucks[bestIdx], custCode, custRouteByCode, custMainRoadByCode, custPoints);
      continue;
    }

    // no existing truck can take the whole customer -- try a brand new (empty) truck before
    // ever resorting to splitting.
    const fresh = newTruck();
    let freshOk = true;
    for (const s of custStacks) {
      const fit = findFit(fresh, s);
      if (!fit) { freshOk = false; break; }
      applyFit(fresh, s, fit);
    }
    if (freshOk) {
      trucks.push(fresh);
      lockTruckGrouping(fresh, custCode, custRouteByCode, custMainRoadByCode, custPoints);
      continue;
    }

    // doesn't fit any single truck even empty -- this customer's own order genuinely needs
    // more than one truck. Pack their own stacks into as few DEDICATED trucks as possible
    // first (fresh truck, fill it via findFit, open another only once it's actually full),
    // rather than searching every existing truck per stack -- that per-stack search sounds
    // more "efficient" but in practice scatters a big order across whatever scraps of room
    // happen to be open on OTHER customers' trucks, which is exactly the opposite of "same
    // customer, same truck": verified on real data, a 111-stack customer that should need 4
    // trucks by floor area was landing on 6, several under 25% full, because individual
    // stacks kept peeling off into unrelated trucks instead of staying together. The last
    // dedicated truck here can still pick up other customers in later iterations of this
    // same loop (it's a completely normal truck once added to `trucks`), so nothing about
    // this loses the ability to backfill leftover room -- it just isn't THIS customer's job
    // to go hunting for scraps in the middle of their own order.
    let cur = newTruck();
    for (const s of custStacks) {
      let fit = findFit(cur, s);
      if (!fit) {
        trucks.push(cur);
        lockTruckGrouping(cur, custCode, custRouteByCode, custMainRoadByCode, custPoints);
        cur = newTruck();
        fit = findFit(cur, s);
      }
      if (!fit) {
        // genuinely doesn't fit an empty truck in any orientation -- buildStacks' flat/vertical
        // pre-check should catch this already, but skip rather than crash the whole report if
        // some other combination slips through.
        console.warn('Stack does not fit an empty truck in any orientation, excluded:', s);
        continue;
      }
      applyFit(cur, s, fit);
    }
    trucks.push(cur);
    lockTruckGrouping(cur, custCode, custRouteByCode, custMainRoadByCode, custPoints);
  }
  return trucks;
}

// two trucks can only be merged if their locked directions don't conflict on either axis
// (same rule directionCompatible uses for a single customer against a truck, just applied
// truck-to-truck).
function trucksDirectionCompatible(a, b) {
  if (a._ns && b._ns && a._ns !== b._ns) return false;
  if (a._ew && b._ew && a._ew !== b._ew) return false;
  return true;
}
// route-locked trucks merge on an exact route match, or -- 路線未成車的再按主幹道相同的排車
// -- on a shared 主幹道 (main road) when the routes differ but the highway corridor to reach
// them is the same; this pass only ever fires between trucks that still have room for each
// other (see below), so a route that already filled a truck on its own never gets merged into
// anything else regardless of what this returns. A route-locked truck never merges with a
// route-less (direction-locked) one -- the two groupings stay separate all the way through.
function trucksGroupingCompatible(a, b) {
  if (a._routeSet && b._routeSet) {
    if (a._route === b._route) return true;
    return !!a._mainRoad && a._mainRoad === b._mainRoad;
  }
  if (a._routeSet || b._routeSet) return false;
  return trucksDirectionCompatible(a, b);
}

// Best-fit-decreasing (even customer-atomic) is still a single forward pass: by the time a
// small, late-processed customer is placed, an earlier truck can look "full enough" to
// reject them even though, in hindsight, two separate under-filled trucks could have been
// one truck all along. This pass looks for exactly that after the fact -- any two
// direction-compatible trucks whose combined customers don't exceed maxCustomers, where
// ALL of one truck's stacks fit into the other -- and merges them, repeating (always trying
// the least-full-by-volume truck first, since it's the best candidate to be fully absorbed --
// same 裝載率-not-floor-area reasoning as packStacksIntoTrucks above) until no more merges are
// possible. Directly trades a bit of extra computation for fewer, fuller trucks, which is the
// explicit ask: consolidate first, worry about anything else after.
function consolidateTrucks(trucks, maxCustomers, custPoints) {
  let merged = true;
  while (merged) {
    merged = false;
    trucks.sort((a, b) => a._cargoVol - b._cargoVol);
    outer:
    for (let i = 0; i < trucks.length; i++) {
      const donor = trucks[i];
      const donorStacks = [];
      for (const row of donor.rows) for (const it of row.items) {
        const { x, y, dx, dy, ...stack } = it;
        donorStacks.push(stack);
      }
      for (let j = 0; j < trucks.length; j++) {
        if (i === j) continue;
        const host = trucks[j];
        const combinedCustCount = new Set([...donor._custSet, ...host._custSet]).size;
        if (combinedCustCount > maxCustomers) continue;
        if (!trucksGroupingCompatible(donor, host)) continue;
        const trial = cloneTruckState(host);
        let ok = true;
        for (const s of donorStacks) {
          const fit = findFit(trial, s);
          if (!fit) { ok = false; break; }
          applyFit(trial, s, fit);
        }
        if (!ok) continue;
        trucks[j] = trial;
        trucks.splice(i, 1);
        merged = true;
        break outer;
      }
    }
  }
  return trucks;
}

function computePlan(lines) {
  const stacks = buildStacks(lines);
  const { custPoints } = buildRouteOrder(stacks);
  const custNameByCode = {};
  for (const s of stacks) if (!(s.custCode in custNameByCode)) custNameByCode[s.custCode] = s.custName;
  const custRouteByCode = {};
  const custMainRoadByCode = {};
  for (const s of stacks) {
    if (!(s.custCode in custRouteByCode)) custRouteByCode[s.custCode] = s.route;
    if (!(s.custCode in custMainRoadByCode)) custMainRoadByCode[s.custCode] = s.mainRoad;
  }

  // never mix delivery dates on one truck — group first; packing order within a date
  // is decided by packStacksIntoTrucks itself (loading rate first, distance second).
  const byDate = new Map();
  for (const s of stacks) {
    if (!byDate.has(s.deliveryDate)) byDate.set(s.deliveryDate, []);
    byDate.get(s.deliveryDate).push(s);
  }
  const dateKeys = [...byDate.keys()].sort();

  const compactTrucks = [];
  const customersSet = new Map();
  for (const s of stacks) customersSet.set(s.custCode, s.custName);
  const customers = [...customersSet.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const custIndex = {}; customers.forEach(([c], i) => custIndex[c] = i);
  const custLabels = customers.map(([c, n]) => `${c} ${n}`);

  let truckNo = 0;
  for (const dd of dateKeys) {
    const trucksRaw = consolidateTrucks(packStacksIntoTrucks(byDate.get(dd), MAX_CUSTOMERS_PER_TRUCK, custPoints, custRouteByCode, custMainRoadByCode), MAX_CUSTOMERS_PER_TRUCK, custPoints);
    const plantPt = currentPlantPoint();
    function computeStopsFor(custCodes) {
      const stops = [];
      const remaining = new Map(custCodes.map(c => [c, custPoints[c]]));
      let cur = [plantPt.lat, plantPt.lng], curCode = 'PLANT';
      while (remaining.size) {
        let nxt = null, nxtD = Infinity;
        for (const [c, p] of remaining) {
          const d = roadKm(curCode, cur, c, p);
          if (d < nxtD) { nxtD = d; nxt = c; }
        }
        const p = remaining.get(nxt);
        stops.push({ code: nxt, name: custNameByCode[nxt], lat: p[0], lng: p[1] });
        cur = p;
        curCode = nxt;
        remaining.delete(nxt);
      }
      // nearest-neighbour alone often leaves one long doubling-back leg; 2-opt cleans that
      // up so both the reported distance and the delivery/loading order it drives are the
      // shorter route, not just a greedy one.
      return twoOptImprove(stops, 'PLANT', [plantPt.lat, plantPt.lng]);
    }

    // repacks one logical truck's raw stacks (delivery-rank sort -> groups ->
    // splitIntoSequentialTrucks, with the manual-mode interleaving double-check) -- shared by
    // the main per-truck pass below and the backfill pass, since a backfill attempt is just
    // this same repack run again on a combined stack list.
    function repackTruckOnce(rawStacks) {
      const custsWithGeo = [...new Set(rawStacks.map(it => it.custCode))].filter(c => custPoints[c]);
      const stopsForOrder = computeStopsFor(custsWithGeo);
      const deliveryRank = {};
      stopsForOrder.forEach((s, i) => deliveryRank[s.code] = i);
      const lastRank = stopsForOrder.length;
      const packOrder = [...rawStacks].sort((a, b) => {
        const ra = a.custCode in deliveryRank ? deliveryRank[a.custCode] : lastRank;
        const rb = b.custCode in deliveryRank ? deliveryRank[b.custCode] : lastRank;
        if (rb !== ra) return rb - ra; // higher rank (delivered later) placed first
        return (b.w * b.l) - (a.w * a.l) /* no alphabetical tiebreak: same-footprint stacks must keep the
          relative order packManualColumns created them in, since that order IS the base/rider
          dependency -- an alphabetical-by-key tiebreak would reorder same-footprint ties by
          coincidence of item-code spelling, which can silently swap a rider ahead of the very
          base it was merged onto. Array.prototype.sort is spec-guaranteed stable, so leaving
          ties unresolved here preserves whatever order they already arrived in instead. */;
      });
      const groups = [];
      for (const s of packOrder) {
        const gk = stackGroupKey(s);
        if (!groups.length || groups[groups.length - 1].key !== gk) groups.push({ key: gk, stacks: [] });
        groups[groups.length - 1].stacks.push(s);
      }
      let subTruckItemsList = splitIntoSequentialTrucks(groups, TRUCK_L, TRUCK_W);
      if (LOAD_MODE === 'manual' && subTruckItemsList.some(hasInterleaving)) {
        forceRowPacking = true;
        subTruckItemsList = splitIntoSequentialTrucks(groups, TRUCK_L, TRUCK_W);
        forceRowPacking = false;
      }
      return subTruckItemsList;
    }

    // 手工疊車 only: the stacking decision (packManualColumns, which orders ride on top of which)
    // and the floor-placement decision (repackTruckOnce's skyline packing) are coupled -- a
    // stacking choice made with zero visibility into the floor layout can use up an item that
    // would have completed a row perfectly side by side, and floor placement can only work with
    // whatever units stacking already committed to; it has no way to "unstack" something and try
    // again. Truly solving that jointly (optimal 3D placement with conditional height-merging) is
    // NP-hard in general. What IS tractable: generate a couple of candidate stacking DECISIONS
    // for this truck's own cargo, run each one all the way through the real floor placement, and
    // keep whichever candidate's ACTUAL resulting truck count / floor length is best -- not a
    // heuristic guess about which one SHOULD be better (an earlier attempt that skipped straight
    // to a heuristic, without checking the real outcome, made the plan worse overall on real
    // data). rawStacks itself (the global packManualColumns pass's own decision) is always one of
    // the candidates, so this can never do worse than not trying at all.
    function repackTruck(rawStacks) {
      if (LOAD_MODE !== 'manual') return repackTruckOnce(rawStacks);

      const verticals = rawStacks.filter(s => s.boxW > TRUCK_W && s.boxL > TRUCK_W);
      const flatStacks = rawStacks.filter(s => !(s.boxW > TRUCK_W && s.boxL > TRUCK_W));
      const orderLines = flatStacks.length ? unmergeToOrderLines(flatStacks) : [];

      const candidateStackLists = [rawStacks];
      if (orderLines.length) {
        candidateStackLists.push([...verticals, ...packManualColumns(orderLines, MANUAL_MAX_TOTAL_HEIGHT, 'none')]);
      }

      let best = null, bestScore = null;
      for (const candidate of candidateStackLists) {
        const result = repackTruckOnce(candidate);
        const score = packingScore(result);
        if (!bestScore || scoreIsBetter(score, bestScore)) { best = result; bestScore = score; }
      }
      return best;
    }

    // Phase 1: repack every logical truck from packStacksIntoTrucks/consolidateTrucks into its
    // own physical truck(s) -- guaranteed non-interleaved, almost always one physical truck,
    // occasionally more if a truck's best-fit membership turns out too tight to rearrange
    // contiguously (see splitIntoSequentialTrucks for why that trade-off is made). Collected
    // here rather than finalized immediately, since the backfill pass below needs to see every
    // logical truck's result before any of them are turned into compactTrucks entries.
    const perLogicalTruck = [];
    for (const t of trucksRaw) {
      // pull the truck's raw stack list back out (stripping the x/y/dx/dy that
      // packStacksIntoTrucks assigned) so it can be re-packed in delivery order --
      // membership is already decided, only the physical arrangement changes here.
      const rawStacks = [];
      for (const row of t.rows) for (const it of row.items) {
        const { x, y, dx, dy, ...stack } = it;
        rawStacks.push(stack);
      }
      perLogicalTruck.push({ rawStacks, subTruckItemsList: repackTruck(rawStacks) });
    }

    // Phase 2: backfill pass -- a customer's own order can end up needing one extra, nearly-
    // empty physical truck purely because of floor-shape mismatch during the strict repack
    // above (a small trailing group not fitting the irregular leftover space, even though a
    // freely-reordered packing would have room -- see splitIntoSequentialTrucks), even when a
    // DIFFERENT logical truck on the same date already carries that same customer with genuine
    // spare room. If the last physical truck from a logical truck that split into multiple
    // physical trucks holds only one customer, try folding it into another logical truck (one
    // that stayed exactly one physical truck) that already has that customer, by re-deriving
    // that whole truck's stack list with the leftover merged in and re-running the exact same
    // guaranteed-safe repack -- only keeping the result if it's STILL exactly one physical
    // truck, so this can only ever remove a truck, never introduce interleaving that repackTruck
    // itself wouldn't already have caught.
    for (let i = 0; i < perLogicalTruck.length; i++) {
      const src = perLogicalTruck[i];
      if (src.subTruckItemsList.length < 2) continue;
      const lastPhysical = src.subTruckItemsList[src.subTruckItemsList.length - 1];
      const custsInLast = new Set(lastPhysical.map(it => it.custCode));
      if (custsInLast.size !== 1) continue;
      const [onlyCust] = custsInLast;
      const leftoverRaw = lastPhysical.map(({ x, y, dx, dy, y0, ...s }) => s);

      for (let j = 0; j < perLogicalTruck.length; j++) {
        if (j === i) continue;
        const tgt = perLogicalTruck[j];
        if (tgt.subTruckItemsList.length !== 1) continue;
        if (!tgt.rawStacks.some(s => s.custCode === onlyCust)) continue;
        const combinedRaw = [...tgt.rawStacks, ...leftoverRaw];
        const combinedSplit = repackTruck(combinedRaw);
        if (combinedSplit.length === 1) {
          tgt.rawStacks = combinedRaw;
          tgt.subTruckItemsList = combinedSplit;
          src.subTruckItemsList = src.subTruckItemsList.slice(0, -1);
          break;
        }
      }
    }

    // Phase 3: finalize -- build the compactTrucks entry for every physical truck, after the
    // backfill pass above has had a chance to eliminate small leftover ones.
    for (const { subTruckItemsList } of perLogicalTruck) {
      for (const rawItems of subTruckItemsList) {
        // manual mode's merged columns (see packManualColumns) travel as one placeable unit
        // through packing/placement -- unpack each rider back into its own report row/3D item.
        const items = expandItemsWithChildren(rawItems);
        truckNo++;
        // 裝載率 = 車廂空間使用率(體積),不是樓面使用率(面積) -- 每疊貨的實際體積(含棧板底
        // 高)除以整台車廂容積,才反映得出這台車實際裝了多少東西,而不是只看地板佔了多少。
        const cargoVol = items.reduce((s, it) => s + it.dx * it.dy * it.height, 0);
        const custCounts = {};
        for (const it of items) {
          const key = it.custCode + '|' + it.custName;
          custCounts[key] = (custCounts[key] || 0) + 1;
        }
        let primaryKey = null, primaryN = -1;
        for (const k in custCounts) if (custCounts[k] > primaryN) { primaryN = custCounts[k]; primaryKey = k; }
        const [primaryCode, primaryName] = primaryKey ? primaryKey.split('|') : ['', ''];

        // key = same grouping the dispatch sheet aggregates by (cust+order+item+flute+dims).
        // loadOrder = the sequence this group was first physically placed onto the truck --
        // the dispatch sheet lists rows in this order, not delivery-route order, so it reads
        // top-to-bottom the same way the truck actually gets loaded.
        const keyOf = stackGroupKey;
        const agg = {};
        let loadSeq = 0;
        for (const it of items) {
          const key = keyOf(it);
          if (!agg[key]) agg[key] = {
            boxes: 0, pallets: 0, caiPerBox: it.caiPerBox, maxCargoH: 0, baseHeight: it.baseHeight,
            custCode: it.custCode, custName: it.custName, orderNo: it.orderNo, item: it.itemCode, flute: it.fluteType,
            w: it.boxW, l: it.boxL, t: it.t, palletW: it.nomW, palletL: it.nomL, unitCode: it.unitCode,
            loadOrder: loadSeq++,
          };
          agg[key].boxes += it.boxes;
          agg[key].pallets += 1;
          agg[key].maxCargoH = Math.max(agg[key].maxCargoH, it.cargoHeight);
        }
        const rowsAgg = Object.values(agg).sort((a, b) => a.loadOrder - b.loadOrder).map((v, i) => ({
          seq: i + 1,
          cust_code: v.custCode, cust_name: v.custName, order_no: v.orderNo, item: v.item, flute: v.flute,
          w: v.w, l: v.l, t: v.t, palletW: v.palletW, palletL: v.palletL,
          boxes: Math.round(v.boxes), pallets: v.pallets,
          stackH: round1(v.maxCargoH), palletTotalH: round1(v.maxCargoH + v.baseHeight),
          caiPerBox: round3(v.caiPerBox), caiTotal: round2(v.caiPerBox * v.boxes),
          unit: v.unitCode === '1' ? '板' : (v.unitCode === '2' ? '箱' : (v.unitCode || '—')),
        }));

        // seq per physical stack in the 3D view == the seq of its dispatch-sheet row, so the
        // number you see on a stack (hover, or the on-model label) is directly the same
        // number as the row it belongs to — the two views read as one consistent sequence.
        const seqByKey = {};
        rowsAgg.forEach((r, i) => { seqByKey[[r.cust_code, r.cust_name, r.order_no, r.item, r.flute, r.w, r.l, r.t, r.palletW, r.palletL].join('||')] = r.seq; });
        const citems = items.map(it => ({
          x: round1(it.x), y: round1(it.y), dx: round1(it.dx), dy: round1(it.dy),
          h: round1(it.height), baseH: it.baseHeight, c: custIndex[it.custCode],
          o: it.orderNo, it: it.itemCode, b: Math.round(it.boxes), fl: it.fluteType,
          seq: seqByKey[keyOf(it)],
          y0: round1(it.y0 || 0),
        }));

        // this physical truck's own delivery route, from just its own customers (may be a
        // subset of the original truck's customers if it got split -- see above).
        const truckCustsWithGeo = [...new Set(items.map(it => it.custCode))].filter(c => custPoints[c]);
        const stops = computeStopsFor(truckCustsWithGeo);
        let distKm = 0;
        if (stops.length) distKm += roadKm('PLANT', [plantPt.lat, plantPt.lng], stops[0].code, [stops[0].lat, stops[0].lng]);
        for (let i = 0; i < stops.length - 1; i++) distKm += roadKm(stops[i].code, [stops[i].lat, stops[i].lng], stops[i + 1].code, [stops[i + 1].lat, stops[i + 1].lng]);

        const caiTotalTruck = round2(rowsAgg.reduce((s, r) => s + r.caiTotal, 0));

        compactTrucks.push({
          n: truckNo, deliveryDate: dd,
          util: round1(cargoVol / (TRUCK_L * TRUCK_W * TRUCK_H) * 100), stacks: items.length,
          primaryCust: `${primaryCode} ${primaryName}` + (Object.keys(custCounts).length === 1 ? '' : ` 等${Object.keys(custCounts).length}家`),
          items: citems, rows: rowsAgg,
          stops, distanceKm: round1(distKm),
          caiTotal: caiTotalTruck,
        });
      }
    }
  }

  const allCustPoints = Object.keys(custPoints).map(c => ({ code: c, name: custNameByCode[c], lat: custPoints[c][0], lng: custPoints[c][1] }));

  return {
    truckDims: { L: TRUCK_L, W: TRUCK_W, H: TRUCK_H },
    customers: custLabels,
    allCustPoints,
    trucks: compactTrucks,
    meta: {
      totalOrders: new Set(stacks.map(s => s.orderNo)).size,
      totalLines: lines.length,
      totalBoxes: Math.round(stacks.reduce((s, x) => s + x.boxes, 0)),
      totalTrucks: compactTrucks.length,
      totalCustomers: customers.length,
      custWithGeo: Object.keys(custPoints).length,
      totalCai: round2(compactTrucks.reduce((s, t) => s + t.caiTotal, 0)),
      totalDistanceKm: round1(compactTrucks.reduce((s, t) => s + t.distanceKm, 0)),
    },
  };
}

// 模擬裝車: place a hand-picked set of order lines into exactly ONE truck (current
// L/W/H/load-mode/overhang settings), instead of computePlan's full multi-truck /
// multi-customer-clustering pipeline. Anything that doesn't fit is left unplaced and reported
// back rather than spilling into a second truck -- the whole point of this mode is to answer
// "would THESE specific orders load into one truck", not to produce a dispatch plan.
//
// Reuses buildStacks/placeStackSequential/expandItemsWithChildren exactly as computePlan does,
// so pallet-vs-manual mode, same-customer on-top stacking, and the skyline floor packer all
// behave identically here -- only the multi-truck-splitting and cross-customer-routing layers
// (packStacksIntoTrucks/consolidateTrucks/splitIntoSequentialTrucks) are skipped, since the
// user has already hand-picked exactly what should share this one truck.
function simulateSingleTruck(lines) {
  const stacks = buildStacks(lines);
  if (!stacks.length) return null;

  const { custPoints } = buildRouteOrder(stacks);
  const custNameByCode = {};
  for (const s of stacks) if (!(s.custCode in custNameByCode)) custNameByCode[s.custCode] = s.custName;

  // reuse the SAME custCode->index mapping the current auto-mode plan already uses (DATA is
  // always kept in sync with the same order-date/delivery-date filters this picker reads from),
  // so a customer's legend color/label stays consistent whether you're looking at the automatic
  // plan or a simulated truck -- and so renderLegend/renderCanvas's `DATA.customers[ci]` lookups
  // stay valid instead of pointing at the wrong customer.
  const custIndex = {};
  (DATA && DATA.customers ? DATA.customers : []).forEach((label, i) => {
    custIndex[label.slice(0, label.indexOf(' '))] = i;
  });
  let nextIdx = Object.keys(custIndex).length;
  for (const s of stacks) if (!(s.custCode in custIndex)) custIndex[s.custCode] = nextIdx++;

  const plantPt = currentPlantPoint();
  function computeStopsFor(custCodes) {
    const stops = [];
    const remaining = new Map(custCodes.map(c => [c, custPoints[c]]));
    let cur = [plantPt.lat, plantPt.lng], curCode = 'PLANT';
    while (remaining.size) {
      let nxt = null, nxtD = Infinity;
      for (const [c, p] of remaining) {
        const d = roadKm(curCode, cur, c, p);
        if (d < nxtD) { nxtD = d; nxt = c; }
      }
      const p = remaining.get(nxt);
      stops.push({ code: nxt, name: custNameByCode[nxt], lat: p[0], lng: p[1] });
      cur = p; curCode = nxt;
      remaining.delete(nxt);
    }
    return twoOptImprove(stops, 'PLANT', [plantPt.lat, plantPt.lng]);
  }

  // same packOrder as repackTruck (delivery-rank, then footprint descending, stable) -- used
  // as the baseline candidate below, and to build the same customer/order-clustered groups
  // placeGroupsBestFit operates on.
  const custsWithGeo = [...new Set(stacks.map(s => s.custCode))].filter(c => custPoints[c]);
  const stopsForOrder = computeStopsFor(custsWithGeo);
  const deliveryRank = {};
  stopsForOrder.forEach((s, i) => deliveryRank[s.code] = i);
  const lastRank = stopsForOrder.length;
  const packOrder = [...stacks].sort((a, b) => {
    const ra = a.custCode in deliveryRank ? deliveryRank[a.custCode] : lastRank;
    const rb = b.custCode in deliveryRank ? deliveryRank[b.custCode] : lastRank;
    if (rb !== ra) return rb - ra;
    return (b.w * b.l) - (a.w * a.l);
  });
  const groups = [];
  for (const s of packOrder) {
    const gk = stackGroupKey(s);
    if (!groups.length || groups[groups.length - 1].key !== gk) groups.push({ key: gk, stacks: [] });
    groups[groups.length - 1].stacks.push(s);
  }

  // best-effort multi-strategy placement: unlike placeGroupsBestFit (which requires the WHOLE
  // ordering to fit and then picks whichever packs tightest), a hand-picked selection here may
  // genuinely be too much for one truck -- a single large/awkward item can get squeezed out
  // entirely if it lands late in the delivery-rank-first packOrder and nothing big enough is
  // left to hold it, even though a different ordering would have placed it fine (the same
  // failure mode placeGroupsBestFit's multi-strategy approach exists to avoid). So this tries
  // the same set of candidate group orderings but keeps whichever placed the MOST boxes overall
  // instead of discarding any ordering that leaves something unplaced -- the original packOrder
  // is always one of the candidates, so this can never do worse than the plain sequential order.
  const footprint = g => g.stacks[0].w * g.stacks[0].l;
  const minSide = g => Math.min(g.stacks[0].w, g.stacks[0].l);
  const strategies = LOAD_MODE === 'manual' ? [
    gs => gs,
    gs => [...gs].sort((a, b) => footprint(b) - footprint(a)),
    gs => [...gs].sort((a, b) => minSide(b) - minSide(a)),
    gs => [...gs].sort((a, b) => minSide(a) - minSide(b)),
  ] : [gs => gs];

  let truck = null, unplaced = null, bestPlacedBoxes = -1;
  for (const strategy of strategies) {
    const orderedStacks = strategy(groups).flatMap(g => g.stacks);
    if (LOAD_MODE === 'manual' && !isLoadOrderSafeStackList(orderedStacks)) continue;
    const trial = newTruck();
    const trialUnplaced = [];
    for (const s of orderedStacks) {
      if (!placeStackSequential(trial, s)) trialUnplaced.push(s);
    }
    const placedBoxes = expandItemsWithChildren(trial._placementOrder).reduce((s, it) => s + it.boxes, 0);
    if (placedBoxes > bestPlacedBoxes) { bestPlacedBoxes = placedBoxes; truck = trial; unplaced = trialUnplaced; }
  }

  const items = expandItemsWithChildren(truck._placementOrder);
  const keyOf = stackGroupKey;
  const agg = {};
  let loadSeq = 0;
  for (const it of items) {
    const key = keyOf(it);
    if (!agg[key]) agg[key] = {
      boxes: 0, pallets: 0, caiPerBox: it.caiPerBox, maxCargoH: 0, baseHeight: it.baseHeight,
      custCode: it.custCode, custName: it.custName, orderNo: it.orderNo, item: it.itemCode, flute: it.fluteType,
      w: it.boxW, l: it.boxL, t: it.t, palletW: it.nomW, palletL: it.nomL, unitCode: it.unitCode,
      loadOrder: loadSeq++,
    };
    agg[key].boxes += it.boxes;
    agg[key].pallets += 1;
    agg[key].maxCargoH = Math.max(agg[key].maxCargoH, it.cargoHeight);
  }
  const rowsAgg = Object.values(agg).sort((a, b) => a.loadOrder - b.loadOrder).map((v, i) => ({
    seq: i + 1,
    cust_code: v.custCode, cust_name: v.custName, order_no: v.orderNo, item: v.item, flute: v.flute,
    w: v.w, l: v.l, t: v.t, palletW: v.palletW, palletL: v.palletL,
    boxes: Math.round(v.boxes), pallets: v.pallets,
    stackH: round1(v.maxCargoH), palletTotalH: round1(v.maxCargoH + v.baseHeight),
    caiPerBox: round3(v.caiPerBox), caiTotal: round2(v.caiPerBox * v.boxes),
    unit: v.unitCode === '1' ? '板' : (v.unitCode === '2' ? '箱' : (v.unitCode || '—')),
  }));

  const seqByKey = {};
  rowsAgg.forEach(r => { seqByKey[[r.cust_code, r.cust_name, r.order_no, r.item, r.flute, r.w, r.l, r.t, r.palletW, r.palletL].join('||')] = r.seq; });
  const citems = items.map(it => ({
    x: round1(it.x), y: round1(it.y), dx: round1(it.dx), dy: round1(it.dy),
    h: round1(it.height), baseH: it.baseHeight, c: custIndex[it.custCode],
    o: it.orderNo, it: it.itemCode, b: Math.round(it.boxes), fl: it.fluteType,
    seq: seqByKey[keyOf(it)], y0: round1(it.y0 || 0),
  }));

  const custCounts = {};
  for (const it of items) { const key = it.custCode + '|' + it.custName; custCounts[key] = (custCounts[key] || 0) + 1; }
  let primaryKey = null, primaryN = -1;
  for (const k in custCounts) if (custCounts[k] > primaryN) { primaryN = custCounts[k]; primaryKey = k; }
  const [primaryCode, primaryName] = primaryKey ? primaryKey.split('|') : ['', ''];

  const cargoVol = items.reduce((s, it) => s + it.dx * it.dy * it.height, 0);
  const truckCustsWithGeo = [...new Set(items.map(it => it.custCode))].filter(c => custPoints[c]);
  const stops = computeStopsFor(truckCustsWithGeo);
  let distKm = 0;
  if (stops.length) distKm += roadKm('PLANT', [plantPt.lat, plantPt.lng], stops[0].code, [stops[0].lat, stops[0].lng]);
  for (let i = 0; i < stops.length - 1; i++) distKm += roadKm(stops[i].code, [stops[i].lat, stops[i].lng], stops[i + 1].code, [stops[i + 1].lat, stops[i + 1].lng]);
  const caiTotalTruck = round2(rowsAgg.reduce((s, r) => s + r.caiTotal, 0));

  // unplaced boxes, aggregated by order+item so the overflow warning reads as a short list
  // instead of one line per physical stack. A stack that failed to place may be a manual-mode
  // merged column (packManualColumns) carrying OTHER orders' boxes as riders in "_children" --
  // those riders never got their own entry in `unplaced` (only the base stack did, and the
  // base's own "boxes" count excludes them), so they'd silently disappear from this summary
  // without walking "_children" here too.
  const unplacedAgg = {};
  for (const s of unplaced) {
    for (const p of [s, ...(s._children || [])]) {
      const key = [p.custCode, p.orderNo, p.itemCode].join('||');
      if (!unplacedAgg[key]) unplacedAgg[key] = { custCode: p.custCode, custName: p.custName, orderNo: p.orderNo, itemCode: p.itemCode, boxes: 0 };
      unplacedAgg[key].boxes += p.boxes;
    }
  }

  return {
    truck: {
      n: '模擬', deliveryDate: '—',
      util: round1(cargoVol / (TRUCK_L * TRUCK_W * TRUCK_H) * 100), stacks: items.length,
      primaryCust: `${primaryCode} ${primaryName}` + (Object.keys(custCounts).length === 1 ? '' : ` 等${Object.keys(custCounts).length}家`),
      items: citems, rows: rowsAgg,
      stops, distanceKm: round1(distKm),
      caiTotal: caiTotalTruck,
    },
    unplaced: Object.values(unplacedAgg),
  };
}

function isoDate(d) { return d.toISOString().slice(0, 10); }
function defaultRange() {
  // production report: the CSV is already one extraction batch for ONE order-date (unlike the
  // demo Artifact, which spans a rolling multi-day window) -- default the visible range to
  // exactly that date so recompute()'s filter doesn't exclude the only data present.
  return [REPORT_DEFAULTS.dateLabel, REPORT_DEFAULTS.dateLabel];
}
function defaultDeliveryDate() {
  // production's extraction doesn't currently carry a delivery-date (oea101) column per line
  // (every line's `dd` comes through as null -- see buildStacks) -- defaulting this filter to
  // "tomorrow" the way the demo Artifact does would exclude every row (null never equals a
  // specific date string) and the report would load empty. Cleared is the only safe default.
  return '';
}

let DATA = null;
const state = { current: 0 };

// 模擬裝車 mode: user hand-picks a set of delivery customers/orders (instead of letting the
// automatic planner choose) and sees whether they'd load into ONE truck of the current
// dimensions/load-mode. SIM_SELECTED holds "custCode||orderNo" keys; SIM_RESULT is the last
// simulateSingleTruck() output (or null before the first run / after the selection changes).
let VIEW_MODE = 'auto'; // 'auto' | 'sim'
let SIM_SELECTED = new Set();
let SIM_RESULT = null;
let SIM_FILTER_TEXT = ''; // 模擬裝車 picker's delivery-location search box (customer code or name)

// single source of truth for "which truck should the 3D view / map / table currently show" --
// every render/interaction handler should go through this instead of reaching into
// DATA.trucks[state.current] directly, so drag-to-rotate, wheel-zoom and map-pan keep working
// on whichever truck is actually on screen (auto-mode's selected truck, or the simulated one).
function currentTruck() {
  if (VIEW_MODE === 'sim') return SIM_RESULT ? SIM_RESULT.truck : null;
  return (DATA && DATA.trucks.length) ? DATA.trucks[state.current] : null;
}

function recompute() {
  const startEl = document.getElementById('rangeStart');
  const endEl = document.getElementById('rangeEnd');
  const deliveryEl = document.getElementById('deliveryFilter');
  let startISO = startEl.value, endISO = endEl.value;
  const deliveryISO = deliveryEl.value; // optional — empty means no delivery-date filter
  const note = document.getElementById('rangeNote');
  note.textContent = '';
  if (!startISO || !endISO || startISO > endISO) {
    note.textContent = '訂單日期區間不正確,已還原預設值';
    const [ds, de] = defaultRange();
    startISO = ds; endISO = de;
    startEl.value = ds; endEl.value = de;
  }
  let filtered = currentLines().filter(r => r.od >= startISO && r.od <= endISO);
  if (deliveryISO) filtered = filtered.filter(r => r.dd === deliveryISO);
  DATA = computePlan(filtered);
  if (!DATA.trucks.length) {
    const deliveryPart = deliveryISO ? `、交期=${deliveryISO}` : '';
    note.textContent = `所選訂單日期區間(${startISO} ~ ${endISO}${deliveryPart})內沒有已確認訂單資料`;
  }
  state.current = 0;
  buildStatRow();
  if (VIEW_MODE === 'sim') {
    buildSimPicker();
    // a load-mode/overhang/truck-dims/plant/date change invalidates any existing simulation
    // result -- rerun it automatically so the screen doesn't keep showing a stale packing.
    if (SIM_SELECTED.size) runSimulation(); else { SIM_RESULT = null; render(); }
  } else {
    buildTruckList();
    render();
  }
}

function fmtInt(n) { return Number(n).toLocaleString('en-US'); }

function paletteColor(i, n, dark) {
  const hue = (i * (360 / n)) % 360;
  const sat = 52;
  const light = dark ? 58 : 46;
  return `hsl(${hue.toFixed(1)} ${sat}% ${light}%)`;
}

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function buildStatRow() {
  const m = DATA.meta;
  const stats = [
    ['訂單數', fmtInt(m.totalOrders)],
    ['送貨客戶數', fmtInt(m.totalCustomers)],
    ['總箱數', fmtInt(m.totalBoxes)],
    ['總材數', m.totalCai.toLocaleString('en-US', {maximumFractionDigits:0})],
    ['需求車次', fmtInt(m.totalTrucks)],
    ['總配送距離', `${m.totalDistanceKm.toLocaleString('en-US', {maximumFractionDigits:1})} km`],
  ];
  const row = document.getElementById('statRow');
  row.innerHTML = stats.map(([lbl, num]) =>
    `<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`
  ).join('');
  document.getElementById('metaPlant').textContent = currentPlantLabel();
  document.getElementById('metaDate').textContent = REPORT_DEFAULTS.dateLabel;
}

function buildTruckList() {
  const list = document.getElementById('truckList');
  list.innerHTML = '<div class="list-head">車次列表(依送貨日期 → 裝載率)</div>';
  if (!DATA.trucks.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.style.padding = '4px 16px';
    empty.textContent = '此區間無車次';
    list.appendChild(empty);
    return;
  }
  let lastDate = null;
  DATA.trucks.forEach((t, idx) => {
    if (t.deliveryDate !== lastDate) {
      lastDate = t.deliveryDate;
      const head = document.createElement('div');
      head.textContent = `送貨日 ${t.deliveryDate}`;
      head.style.cssText = 'padding:10px 16px 4px;font-size:11px;color:var(--accent-2);font-weight:700;letter-spacing:.03em;';
      list.appendChild(head);
    }
    const btn = document.createElement('button');
    btn.className = 'truck-item' + (idx === state.current ? ' active' : '');
    btn.dataset.idx = idx;
    const low = t.util < 50 ? ' low' : '';
    btn.innerHTML = `
      <div class="row1"><span class="no">車次 ${t.n}</span><span class="stacks">${t.stacks} 堆</span></div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.primaryCust}</div>
      <div class="util-bar${low}"><i style="width:${t.util}%"></i></div>
    `;
    btn.addEventListener('click', () => selectTruck(idx));
    list.appendChild(btn);
  });
}

function selectTruck(idx) {
  state.current = idx;
  document.querySelectorAll('.truck-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  render();
}

// same order-date-range + delivery-date-filter the automatic plan (DATA) is currently built
// from, so every customer/order the picker offers is guaranteed to already have a legend
// color/index reserved for it in DATA.customers (see simulateSingleTruck's custIndex reuse).
function simFilteredLines() {
  const startEl = document.getElementById('rangeStart'), endEl = document.getElementById('rangeEnd');
  const deliveryEl = document.getElementById('deliveryFilter');
  let filtered = currentLines().filter(r => r.od >= startEl.value && r.od <= endEl.value);
  if (deliveryEl.value) filtered = filtered.filter(r => r.dd === deliveryEl.value);
  return filtered;
}

function buildSimPicker() {
  const lines = simFilteredLines();
  // drop selections that fell out of range (plant/date-range/delivery-filter changed underneath
  // the picker) so a stale checkbox key can't silently vanish a customer from a later simulation.
  const validKeys = new Set(lines.map(r => r.cc + '||' + r.o));
  for (const k of [...SIM_SELECTED]) if (!validKeys.has(k)) SIM_SELECTED.delete(k);

  const list = document.getElementById('truckList');
  list.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'list-head';
  head.textContent = '模擬裝車 — 勾選送貨地點/訂單';
  list.appendChild(head);

  const summary = document.createElement('div');
  summary.className = 'sim-summary';
  list.appendChild(summary);

  const actions = document.createElement('div');
  actions.className = 'sim-actions';
  const simBtn = document.createElement('button');
  simBtn.type = 'button'; simBtn.className = 'primary'; simBtn.textContent = '模擬裝車';
  simBtn.addEventListener('click', runSimulation);
  const clearBtn = document.createElement('button');
  clearBtn.type = 'button'; clearBtn.className = 'secondary'; clearBtn.textContent = '清空';
  clearBtn.addEventListener('click', () => { SIM_SELECTED.clear(); SIM_RESULT = null; buildSimPicker(); render(); });
  actions.appendChild(simBtn); actions.appendChild(clearBtn);
  list.appendChild(actions);

  // delivery-location search box -- lives OUTSIDE the entries container and is never recreated
  // by renderSimEntries, so typing doesn't lose focus/cursor position the way a full list.innerHTML
  // rebuild on every keystroke would (checkbox toggles don't need focus preserved, so THEY still
  // go through the simpler full-rebuild path elsewhere).
  const searchWrap = document.createElement('div');
  searchWrap.className = 'sim-search';
  const searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.placeholder = '篩選送貨地點(客戶代號或名稱)';
  searchInput.value = SIM_FILTER_TEXT;
  searchWrap.appendChild(searchInput);
  list.appendChild(searchWrap);

  const entries = document.createElement('div');
  entries.id = 'simEntries';
  list.appendChild(entries);

  searchInput.addEventListener('input', () => {
    SIM_FILTER_TEXT = searchInput.value;
    renderSimEntries(entries, summary, lines);
  });

  if (!lines.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.style.padding = '4px 16px';
    empty.textContent = '此區間無訂單資料';
    entries.appendChild(empty);
    updateSimSummary(summary, []);
    return;
  }

  renderSimEntries(entries, summary, lines);
}

// renders the customer/order checkbox tree into `container`, filtered by SIM_FILTER_TEXT
// against customer code/name -- split out from buildSimPicker so the search box and checkbox
// toggles can both refresh just this part without tearing down (and defocusing) the search
// input itself. `summary` always reflects the TRUE selection across the full `lines` set,
// never just whatever the search happens to be showing right now.
function renderSimEntries(container, summary, lines) {
  container.innerHTML = '';
  const q = SIM_FILTER_TEXT.trim().toLowerCase();

  const byCust = new Map();
  for (const r of lines) {
    if (!byCust.has(r.cc)) byCust.set(r.cc, { name: r.cn, orders: new Map() });
    const entry = byCust.get(r.cc);
    if (!entry.orders.has(r.o)) entry.orders.set(r.o, []);
    entry.orders.get(r.o).push(r);
  }
  let custEntries = [...byCust.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  if (q) {
    custEntries = custEntries.filter(([cc, { name }]) =>
      cc.toLowerCase().includes(q) || name.toLowerCase().includes(q));
  }

  if (!custEntries.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.style.padding = '4px 16px';
    empty.textContent = '沒有符合的送貨地點';
    container.appendChild(empty);
    updateSimSummary(summary, lines);
    return;
  }

  for (const [cc, { name, orders }] of custEntries) {
    const orderNos = [...orders.keys()];
    const custRow = document.createElement('label');
    custRow.className = 'sim-cust';
    const custCb = document.createElement('input');
    custCb.type = 'checkbox';
    const checkedCount = orderNos.filter(o => SIM_SELECTED.has(cc + '||' + o)).length;
    custCb.checked = checkedCount === orderNos.length;
    custCb.indeterminate = checkedCount > 0 && checkedCount < orderNos.length;
    custCb.addEventListener('change', () => {
      for (const o of orderNos) {
        const key = cc + '||' + o;
        if (custCb.checked) SIM_SELECTED.add(key); else SIM_SELECTED.delete(key);
      }
      renderSimEntries(container, summary, lines);
    });
    custRow.appendChild(custCb);
    const custLabel = document.createElement('span');
    custLabel.textContent = `${cc} ${name}`;
    custRow.appendChild(custLabel);
    container.appendChild(custRow);

    for (const [orderNo, orderLines] of orders) {
      const key = cc + '||' + orderNo;
      const orderRow = document.createElement('label');
      orderRow.className = 'sim-order';
      const orderCb = document.createElement('input');
      orderCb.type = 'checkbox';
      orderCb.checked = SIM_SELECTED.has(key);
      orderCb.addEventListener('change', () => {
        if (orderCb.checked) SIM_SELECTED.add(key); else SIM_SELECTED.delete(key);
        renderSimEntries(container, summary, lines);
      });
      orderRow.appendChild(orderCb);
      const totalQty = orderLines.reduce((s, r) => s + r.q, 0);
      const orderLabel = document.createElement('span');
      orderLabel.textContent = `${orderNo}(${orderLines.length}項、${fmtInt(Math.round(totalQty))}箱)`;
      orderRow.appendChild(orderLabel);
      container.appendChild(orderRow);
    }
  }

  updateSimSummary(summary, lines);
}

function updateSimSummary(summary, lines) {
  const selLines = lines.filter(r => SIM_SELECTED.has(r.cc + '||' + r.o));
  const selOrders = new Set(selLines.map(r => r.cc + '||' + r.o));
  const selCusts = new Set(selLines.map(r => r.cc));
  const selBoxes = selLines.reduce((s, r) => s + r.q, 0);
  summary.innerHTML = `已選 <strong>${selCusts.size}</strong> 家送貨地點、<strong>${selOrders.size}</strong> 張訂單、<strong>${fmtInt(Math.round(selBoxes))}</strong> 箱`;
}

function runSimulation() {
  const lines = simFilteredLines();
  const selLines = lines.filter(r => SIM_SELECTED.has(r.cc + '||' + r.o));
  SIM_RESULT = selLines.length ? simulateSingleTruck(selLines) : null;
  render();
}

function render() {
  if (VIEW_MODE === 'sim') { renderSimView(); return; }
  renderAutoView();
}

function clearViewport() {
  document.getElementById('truckTitle').textContent = '—';
  document.getElementById('truckCust').textContent = '';
  document.getElementById('utilPill').textContent = '裝載率 —';
  document.getElementById('caiPill').textContent = '材數 —';
  document.getElementById('legend').innerHTML = '';
  document.getElementById('dispatchBody').innerHTML = '';
  document.getElementById('dispatchFoot').innerHTML = '';
  document.getElementById('mapStats').innerHTML = '';
  const mapStops = document.querySelector('.map-stops'); if (mapStops) mapStops.remove();
  const simCtx = document.getElementById('sim').getContext('2d');
  simCtx.clearRect(0, 0, 99999, 99999);
  const mapCtx = document.getElementById('mapCanvas').getContext('2d');
  mapCtx.clearRect(0, 0, 99999, 99999);
}

function renderAutoView() {
  renderSimOverflowNote(null);
  if (!DATA.trucks.length) { clearViewport(); return; }
  const t = DATA.trucks[state.current];
  document.getElementById('truckTitle').textContent = `車次 ${t.n}`;

function mercY(latDeg) {
  const rad = latDeg * Math.PI / 180;
  return Math.log(Math.tan(Math.PI / 4 + rad / 2));
}

// project lng/lat to a pixel position within the source MAP_BG_SRC image
function lngLatToImagePx(lng, lat) {
  const b = MAP_IMG_BOUNDS;
  const px = (lng - b.west) / (b.east - b.west) * MAP_IMG_W;
  const my0 = mercY(b.north), my1 = mercY(b.south);
  const py = (my0 - mercY(lat)) / (my0 - my1) * MAP_IMG_H;
  return [px, py];
}

// pan/zoom camera state for the route map: cx/cy are the source-image pixel
// coords centred in the canvas; scale is CSS px per source-image px.
let mapCamera = { scale: 1, cx: 0, cy: 0, key: null };
let mapRenderState = null; // last render's {scale, destX0, destY0, cssW, cssH} for hit-testing/interaction
const MAP_MIN_SCALE = 0.4, MAP_MAX_SCALE = 40;

function naturalMapCamera(cssW, cssH) {
  const pts = DATA.allCustPoints;
  const plant = currentPlantPoint();
  const lats = pts.map(p => p.lat).concat([plant.lat]);
  const lngs = pts.map(p => p.lng).concat([plant.lng]);
  const pad = 0.06;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad;
  const minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const [sx0, sy0] = lngLatToImagePx(minLng, maxLat);
  const [sx1, sy1] = lngLatToImagePx(maxLng, minLat);
  const sx = Math.max(0, sx0), sy = Math.max(0, sy0);
  const sw = Math.min(MAP_IMG_W, sx1) - sx, sh = Math.min(MAP_IMG_H, sy1) - sy;
  const scale = Math.min(cssW / sw, cssH / sh);
  return { scale, cx: sx + sw / 2, cy: sy + sh / 2 };
}

function resetMapView() {
  mapCamera.key = null;
  const ct = currentTruck();
  if (ct) renderMap(ct);
}

function zoomMapBy(factor, cssX, cssY) {
  if (!mapRenderState) return;
  const { scale, destX0, destY0, cssW, cssH } = mapRenderState;
  const mx = cssX ?? cssW / 2, my = cssY ?? cssH / 2;
  const imgX = (mx - destX0) / scale, imgY = (my - destY0) / scale;
  const newScale = Math.min(MAP_MAX_SCALE, Math.max(MAP_MIN_SCALE, scale * factor));
  mapCamera.cx = imgX + (cssW / 2 - mx) / newScale;
  mapCamera.cy = imgY + (cssH / 2 - my) / newScale;
  mapCamera.scale = newScale;
  const ct = currentTruck();
  if (ct) renderMap(ct);
}

function renderMap(t) {
  renderMapStats(t);
  const canvas = document.getElementById('mapCanvas');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || canvas.parentElement.clientWidth;
  const cssH = 400;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const dark = isDark();
  const dim = dark ? 'rgba(20,24,28,0.55)' : 'rgba(255,255,255,0.5)';
  const routeColor = dark ? '#c89a66' : '#a86f38';

  const pts = DATA.allCustPoints;
  if (!pts.length) { mapRenderState = null; return; }
  const plant = currentPlantPoint();

  const key = t.n + '|' + CURRENT_PLANT;
  if (mapCamera.key !== key) {
    mapCamera = { ...naturalMapCamera(cssW, cssH), key };
  }
  const { scale, cx, cy } = mapCamera;
  const destX0 = cssW / 2 - cx * scale, destY0 = cssH / 2 - cy * scale;
  mapRenderState = { scale, destX0, destY0, cssW, cssH };

  if (mapImg && mapImg.complete && mapImg.naturalWidth) {
    ctx.drawImage(mapImg, destX0, destY0, MAP_IMG_W * scale, MAP_IMG_H * scale);
    ctx.fillStyle = dim;
    ctx.fillRect(0, 0, cssW, cssH);
  } else {
    ctx.fillStyle = dark ? '#1c2126' : '#e9e4d8';
    ctx.fillRect(0, 0, cssW, cssH);
  }

  function toXY(lat, lng) {
    const [ipx, ipy] = lngLatToImagePx(lng, lat);
    return [ipx * scale + destX0, ipy * scale + destY0];
  }

  // all customers, faint
  pts.forEach(p => {
    const [x, y] = toXY(p.lat, p.lng);
    ctx.beginPath();
    ctx.arc(x, y, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = dark ? 'rgba(231,228,220,0.55)' : 'rgba(35,38,42,0.4)';
    ctx.fill();
  });

  // this truck's route: plant depot first, then stops in delivery order
  const plantXY = toXY(plant.lat, plant.lng);
  const stopXY = t.stops.map(s => toXY(s.lat, s.lng));
  const routeXY = [plantXY, ...stopXY];
  if (routeXY.length > 1) {
    ctx.beginPath();
    routeXY.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.strokeStyle = routeColor;
    ctx.lineWidth = 2.25;
    ctx.stroke();
  }
  stopXY.forEach(([x, y], i) => {
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = routeColor;
    ctx.fill();
    ctx.strokeStyle = dark ? '#14181c' : '#fff';
    ctx.lineWidth = 1.75;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '600 10px var(--font-mono)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), x, y + 0.5);
  });

  // plant depot marker: square, accent colour, labelled 廠
  {
    const [px, py] = plantXY;
    const s = 9;
    const accent = dark ? '#6fb0c8' : '#2e5f73';
    ctx.beginPath();
    ctx.rect(px - s, py - s, s * 2, s * 2);
    ctx.fillStyle = accent;
    ctx.fill();
    ctx.strokeStyle = dark ? '#14181c' : '#fff';
    ctx.lineWidth = 1.75;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '700 11px var(--font-body)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('廠', px, py + 0.5);
  }

  // attribution (required by OpenStreetMap tile usage terms)
  ctx.font = '10px var(--font-body)';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = dark ? 'rgba(231,228,220,0.65)' : 'rgba(35,38,42,0.6)';
  ctx.fillText(MAP_ATTRIBUTION, cssW - 6, cssH - 5);
}

function renderLegend(t) {

  const dark = isDark();

// ---- Excel export (all trucks currently on screen, i.e. the full plan for the current
// plant/date-range/delivery-filter/load-mode/slider settings) ----
// Ships as an HTML table wrapped in an Excel-recognized MIME/namespace shell rather than a
// real .xlsx binary, since this is a single self-contained artifact with no bundled
// libraries and no network access -- Excel opens this directly with correct cell typing
// (numbers stay numeric) and no warnings as long as the extension is .xls, not .xlsx.
function exportDispatchExcel() {
  if (!DATA || !DATA.trucks.length) return;
  const header = ['車次', '疊車順序', '送貨客戶', '訂單號', '品號', '楞別', '單位', '箱數', '箱寬mm', '箱長mm', '厚mm', '單位尺寸mm', '堆數', '堆疊高度mm', '單位總高mm', '材數/箱', '材數合計'];
  const rows = [];
  DATA.trucks.forEach(t => {
    t.rows.forEach(r => {
      rows.push([
        `車次${t.n}`, r.seq, `${r.cust_code} ${r.cust_name}`, r.order_no, r.item, r.flute || '—', r.unit,
        r.boxes, r.w, r.l, r.t, `${r.palletW}×${r.palletL}`, r.pallets, r.stackH, r.palletTotalH,
        r.caiPerBox, Math.round(r.caiTotal * 100) / 100,
      ]);
    });
  });
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const headHtml = '<tr>' + header.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
  const bodyHtml = rows.map(r => '<tr>' + r.map(v => `<td>${esc(v)}</td>`).join('') + '</tr>').join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>排車明細</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>
<body><table border="1">${headHtml}${bodyHtml}</table></body></html>`;
  const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const startISO = document.getElementById('rangeStart').value;
  const endISO = document.getElementById('rangeEnd').value;
  a.href = url;
  a.download = `排車明細_${currentPlantLabel()}_${startISO}~${endISO}.xls`;
  document.body.appendChild(a);

// ---- whole-tool download (single standalone HTML file) ----
// Serializes the live DOM rather than re-fetching the original source, so this always
// matches what's actually on screen. The embedded RAW_LINES_BY_PLANT data and every script
// tag are already part of the page, so the downloaded file is fully self-contained and works
// offline with no claude.ai access -- exactly like opening this page fresh, just from disk.
// Runtime-only state (which truck is selected, slider drag position, 3D camera angle) isn't
// part of the DOM and so isn't preserved; the reopened copy starts at the same defaults this
// page started at, same as visiting the artifact link again.
function downloadStandaloneTool() {
  const html = '<!doctype html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `排車單與3D裝載模擬_${isoDate(new Date())}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
